name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/healthychat:latest
          ${{ secrets.DOCKER_USERNAME }}/healthychat:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/healthychat:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/healthychat:buildcache,mode=max

    - name: Deploy to production
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
          cd /opt/healthychat
          docker-compose pull
          docker-compose up -d --build
          docker-compose exec -T app alembic upgrade head
          docker system prune -f

    - name: Notify deployment
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Deployment completed successfully!"
        # Add notification logic here (Slack, Discord, etc.)

