version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: healthychat_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-healthychat}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthychat_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthychat_app
    environment:
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-healthychat}
      DB_PORT: 5432
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./alembic:/app/alembic
    networks:
      - healthychat_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head &&
        uvicorn app:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data:

networks:
  healthychat_network:
    driver: bridge

